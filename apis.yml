aid: akto
name: Akto
description: 'Akto is a proactive API security platform that discovers, tests, and
  protects APIs and AI systems across an organization''s infrastructure. Its open-source
  core (MIT, Java) delivers automated API discovery, API security posture management,
  and dynamic API security testing (DAST) in CI/CD, backed by a community test library
  of 1000+ tests covering the OWASP API Security Top 10 and HackerOne top vulnerabilities.
  Traffic is ingested from eBPF, Kubernetes, API gateways (Envoy, NGINX, Istio, Kong,
  Apigee, MuleSoft and more), and cloud mirroring, and can be deployed self-hosted
  in ~60 seconds or as SaaS. Akto has expanded into agentic AI security with Atlas
  (shadow-AI discovery for employee-facing endpoints) and Argus (governance and red-teaming
  for homegrown AI, MCP tools, and LLMs), adding runtime guardrails and human-in-the-loop
  testing. Recognized by Gartner in the API and AI-agent protection markets and backed
  by Accel.'
